name: sign-off

on:
  pull_request:

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every commit must carry "Signed-off-by: <author name> <author email>" (git commit -s).
      - name: Check every commit is signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for c in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            trailer="Signed-off-by: $(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format=%B "$c" | grep -qxF "$trailer"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") is missing '$trailer'"
              status=1
            fi
          done
          exit $status
